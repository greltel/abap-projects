version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: "07:00"
      timezone: Europe/Athens
    cooldown:
      default-days: 5
    groups:
      abaplint:
        patterns:
          - "@abaplint/*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

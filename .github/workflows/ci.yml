name: CI

on:
  push:
    branches: [Main]
  pull_request:
    branches: [Main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: abaplint (static analysis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install toolchain
        run: npm ci

      - name: Run abaplint
        run: npm run lint

  unit:
    name: ABAP Unit (off-stack, open-abap)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install toolchain
        run: npm ci

      - name: Transpile and run ABAP Unit
        shell: bash
        run: |
          set -o pipefail
          npm test | tee unit.txt

      - name: Result summary
        if: always()
        shell: bash
        run: |
          {
            echo '### ABAP Unit (off-stack)'
            echo
            if [ -f unit.txt ]; then
              total=$(grep -c ': running ' unit.txt || true)
              skipped=$(grep -c 'skipped due to configuration' unit.txt || true)
              echo "- tests found: ${total:-0}"
              echo "- executed: $(( ${total:-0} - ${skipped:-0} ))"
              echo "- skipped (known off-stack gaps): ${skipped:-0}"
              echo
              echo '<details><summary>Full log</summary>'
              echo
              echo '```'
              cat unit.txt
              echo '```'
              echo
              echo '</details>'
            else
              echo '_No unit log produced — an earlier step failed._'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
